- id: sdm-andal
  order: 1
  title: SDM andal & bertanggung jawab
  description: Tenaga ahli dari berbagai bidang ilmu, direkrut dan dibina untuk bekerja profesional di setiap penempatan.
- id: pengawasan-berlapis
  order: 2
  title: Pengawasan berlapis
  description: Kontrol harian oleh team leader atau danru, ditambah kunjungan supervisor dan koordinator dua kali seminggu.
- id: pelatihan-berkala
  order: 3
  title: Pelatihan berkala
  description: Pelatihan dasar setiap bulan dan team building setiap dua bulan oleh trainer internal perusahaan.
- id: disiplin
  order: 4
  title: Disiplin & taat aturan
  description: Kami menjamin personel tetap disiplin dan taat pada aturan yang berlaku di lingkungan kerja klien.
- id: tersertifikasi
  order: 5
  title: Tersertifikasi
  description: Bersertifikat ISO 9001, ISO 14001, ISO 37001, dan ISO 45001, dengan personel yang mengikuti uji kompetensi BNSP.
- id: hasil-terkontrol
  order: 6
  title: Hasil yang terkontrol
  description: Setiap pekerjaan dicatat dan dievaluasi sehingga klien mendapat jaminan hasil yang memuaskan.
